<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chris Eberle | Control</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f2f2f7;
      color: #1c1c1e;
    }
    .apple-card {
      background: #ffffff;
      border: 1px solid #e5e5ea;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .apple-input {
      background: #f2f2f7;
      border: 1px solid #e5e5ea;
      color: #000000;
    }
    .apple-input:focus {
      outline: none;
      border-color: #007aff;
      background: #ffffff;
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = 'https://yhdvavytnstqsfolxhny.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloZHZhdnl0bnN0cXNmb2x4aG55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODc1MTYsImV4cCI6MjEwMzk2MzUxNn0.ZO3lLVFKghyvrCsDIuRQMGuwcqLc02GKR4yjOn4UDZY';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MESES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    function App() {
      const [view, setView] = useState('inicio');
      const [movimientos, setMovimientos] = useState([]);
      const [gastos, setGastos] = useState([]);
      const [loading, setLoading] = useState(true);
      const [toast, setToast] = useState('');

      const now = new Date();
      const [currentYear, setCurrentYear] = useState(now.getFullYear());
      const [currentMonth, setCurrentMonth] = useState(now.getMonth());

      const fetchData = async () => {
        setLoading(true);
        try {
          const { data: movsData } = await supabaseClient
            .from('movimientos')
            .select('*')
            .order('fecha', { ascending: false })
            .order('created_at', { ascending: false });

          if (movsData) setMovimientos(movsData);

          const { data: gastosData } = await supabaseClient
            .from('gastos_personales')
            .select('*')
            .order('fecha', { ascending: false })
            .order('created_at', { ascending: false });

          if (gastosData) setGastos(gastosData);
        } catch (err) {
          console.error(err);
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchData();
      }, []);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const movimientosMes = useMemo(() => {
        return movimientos.filter(m => {
          const f = new Date(m.fecha + 'T00:00:00');
          return f.getFullYear() === currentYear && f.getMonth() === currentMonth;
        });
      }, [movimientos, currentYear, currentMonth]);

      const gastosMes = useMemo(() => {
        return gastos.filter(g => {
          const f = new Date(g.fecha + 'T00:00:00');
          return f.getFullYear() === currentYear && f.getMonth() === currentMonth;
        });
      }, [gastos, currentYear, currentMonth]);

      const totales = useMemo(() => {
        const res = {
          ARS: { facturacion: 0, costos: 0, ganancia: 0, gastos: 0 },
          USD: { facturacion: 0, costos: 0, ganancia: 0, gastos: 0 }
        };

        movimientosMes.forEach(m => {
          const mon = m.moneda || 'ARS';
          res[mon].facturacion += Number(m.importe || 0);
          res[mon].costos += Number(m.costo || 0);
          res[mon].ganancia += Number(m.ganancia || 0);
        });

        gastosMes.forEach(g => {
          const mon = g.moneda || 'ARS';
          res[mon].gastos += Number(g.monto || 0);
        });

        return res;
      }, [movimientosMes, gastosMes]);

      const navMonth = (delta) => {
        let newM = currentMonth + delta;
        let newY = currentYear;
        if (newM < 0) {
          newM = 11;
          newY -= 1;
        } else if (newM > 11) {
          newM = 0;
          newY += 1;
        }
        setCurrentMonth(newM);
        setCurrentYear(newY);
      };

      return (
        <div class="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24 bg-[#f2f2f7]">
          <header class="p-4 px-5 border-b border-gray-200 flex justify-between items-center bg-white/80 backdrop-blur sticky top-0 z-40">
            <div>
              <h1 class="text-[10px] uppercase tracking-widest text-gray-400 font-bold">Control Personal & Taller</h1>
              <p class="text-lg font-black tracking-tight text-gray-900">Chris Eberle</p>
            </div>
            {toast ? (
              <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs px-3 py-1 rounded-full font-semibold shadow-sm">
                {toast}
              </div>
            ) : (
              <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-[11px] font-semibold px-2.5 py-1 rounded-full border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Online
              </div>
            )}
          </header>

          <main class="p-4 flex-1">
            {view === 'inicio' && (
              <InicioView 
                currentYear={currentYear} 
                currentMonth={currentMonth} 
                navMonth={navMonth} 
                totales={totales} 
                movimientos={movimientosMes} 
                gastos={gastosMes}
                onRegistrarMov={() => setView('registrar')}
                onRegistrarGasto={() => setView('gasto')}
              />
            )}
            {view === 'registrar' && (
              <RegistrarView 
                onSaved={() => {
                  fetchData();
                  setView('inicio');
                  showToast('Movimiento guardado ✓');
                }}
                onCancel={() => setView('inicio')}
              />
            )}
            {view === 'gasto' && (
              <RegistrarGastoView 
                onSaved={() => {
                  fetchData();
                  setView('inicio');
                  showToast('Gasto registrado ✓');
                }}
                onCancel={() => setView('inicio')}
              />
            )}
            {view === 'historial' && (
              <HistorialView movimientos={movimientos} gastos={gastos} />
            )}
          </main>

          <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur border-t border-gray-200 flex justify-around py-3 z-40 shadow-lg">
            <button onClick={() => setView('inicio')} class={`flex flex-col items-center gap-1 ${view === 'inicio' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">🏠</span>
              <span class="text-[11px]">Inicio</span>
            </button>
            <button onClick={() => setView('registrar')} class={`flex flex-col items-center gap-1 ${view === 'registrar' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">🔧</span>
              <span class="text-[11px]">Taller</span>
            </button>
            <button onClick={() => setView('gasto')} class={`flex flex-col items-center gap-1 ${view === 'gasto' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">💸</span>
              <span class="text-[11px]">Gasto</span>
            </button>
            <button onClick={() => setView('historial')} class={`flex flex-col items-center gap-1 ${view === 'historial' ? 'text-blue-600 font-bold' : 'text-gray-400'}`}>
              <span class="text-lg">📋</span>
              <span class="text-[11px]">Historial</span>
            </button>
          </nav>
        </div>
      );
    }

    function InicioView({ currentYear, currentMonth, navMonth, totales, movimientos, gastos, onRegistrarMov, onRegistrarGasto }) {
      const formatCurrency = (val, mon) => (mon === 'ARS' ? '$' : 'USD ') + Number(val).toLocaleString('es-AR');

      return (
        <div class="space-y-4">
          <div class="flex justify-between items-center bg-white p-2.5 rounded-2xl border border-gray-200 shadow-sm">
            <button onClick={() => navMonth(-1)} class="w-8 h-8 flex items-center justify-center text-gray-500 font-black rounded-xl hover:bg-gray-100">&lt;</button>
            <span class="text-xs font-bold uppercase tracking-wider text-gray-700">
              {MESES[currentMonth]} {currentYear}
            </span>
            <button onClick={() => navMonth(1)} class="w-8 h-8 flex items-center justify-center text-gray-500 font-black rounded-xl hover:bg-gray-100">&gt;</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button 
              onClick={onRegistrarMov}
              class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all text-white font-bold py-3 rounded-2xl shadow-md text-center text-xs tracking-wide flex items-center justify-center gap-1.5"
            >
              <span>🔧</span> NUEVO TRABAJO
            </button>
            <button 
              onClick={onRegistrarGasto}
              class="bg-rose-600 hover:bg-rose-700 active:scale-[0.98] transition-all text-white font-bold py-3 rounded-2xl shadow-md text-center text-xs tracking-wide flex items-center justify-center gap-1.5"
            >
              <span>🛒</span> GASTO PERSONAL
            </button>
          </div>

          {/* Resumen ARS */}
          <div class="apple-card p-4 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
              <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Caja Pesos (ARS)</h2>
              <span class="text-[10px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded-full">ARS</span>
            </div>
            <div class="grid grid-cols-3 gap-2 pt-0.5 text-center">
              <div>
                <p class="text-[10px] text-gray-400 font-semibold uppercase">Taller Ganancia</p>
                <p class="text-xs font-bold text-emerald-600">{formatCurrency(totales.ARS.ganancia, 'ARS')}</p>
              </div>
              <div>
                <p class="text-[10px] text-gray-400 font-semibold uppercase">Gastos Pers.</p>
                <p class="text-xs font-bold text-rose-500">-{formatCurrency(totales.ARS.gastos, 'ARS')}</p>
              </div>
              <div>
                <p class="text-[10px] text-gray-700 font-semibold uppercase">Remanente</p>
                <p class={`text-xs font-black ${totales.ARS.ganancia - totales.ARS.gastos >= 0 ? 'text-gray-900' : 'text-rose-600'}`}>
                  {formatCurrency(totales.ARS.ganancia - totales.ARS.gastos, 'ARS')}
                </p>
              </div>
            </div>
          </div>

          {/* Últimos Gastos Personales */}
          <div class="space-y-2 pt-1">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Últimos Gastos Personales</h3>
            {gastos.length === 0 ? (
              <div class="apple-card p-4 rounded-2xl text-center">
                <p class="text-xs text-gray-400">Sin gastos cargados este mes.</p>
              </div>
            ) : (
              <div class="space-y-2">
                {gastos.slice(0, 4).map((g) => (
                  <div key={g.id} class="apple-card p-3 rounded-xl flex justify-between items-center">
                    <div>
                      <p class="text-xs font-bold text-gray-900">{g.concepto}</p>
                      <span class="text-[10px] bg-gray-100 text-gray-500 font-semibold px-2 py-0.5 rounded-full">{g.categoria}</span>
                    </div>
                    <p class="text-xs font-black text-rose-500">
                      -{g.moneda === 'ARS' ? '$' : 'USD '}{Number(g.monto).toLocaleString('es-AR')}
                    </p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    function RegistrarGastoView({ onSaved, onCancel }) {
      const [concepto, setConcepto] = useState('');
      const [categoria, setCategoria] = useState('Supermercado / Comida');
      const [monto, setMonto] = useState('');
      const [moneda, setMoneda] = useState('ARS');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!concepto || !monto) return;

        setIsSubmitting(true);

        const payload = {
          concepto: concepto.trim(),
          categoria,
          monto: Number(monto),
          moneda,
          fecha: new Date().toISOString().split('T')[0]
        };

        try {
          const { error } = await supabaseClient.from('gastos_personales').insert([payload]);

          setIsSubmitting(false);

          if (!error) {
            onSaved();
          } else {
            alert('Error al guardar: ' + error.message);
          }
        } catch (err) {
          setIsSubmitting(false);
          alert('Error de conexión.');
        }
      };

      return (
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-bold text-rose-600 uppercase tracking-wider">Nuevo Gasto Personal</h2>
            <button onClick={onCancel} class="text-xs text-gray-400 font-semibold">Cancelar</button>
          </div>

          <form onSubmit={handleSubmit} class="space-y-3.5">
            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">¿En qué gastaste?</label>
              <input 
                type="text" 
                required
                placeholder="Ej: Supermercado, Kiosco, Nafta, Salida"
                value={concepto} 
                onChange={e => setConcepto(e.target.value)}
                class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
              />
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Categoría</label>
              <select 
                value={categoria} 
                onChange={e => setCategoria(e.target.value)}
                class="w-full apple-input rounded-xl px-3 py-2.5 text-xs font-medium"
              >
                <option value="Supermercado / Comida">🛒 Supermercado / Comida</option>
                <option value="Transporte / Auto">🚗 Transporte / Auto</option>
                <option value="Servicios / Cuentas">📄 Servicios / Cuentas</option>
                <option value="Salidas / Ocio">☕ Salidas / Ocio</option>
                <option value="Varios">📦 Varios</option>
              </select>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Monto ($)</label>
              <input 
                type="number" 
                required
                step="any"
                placeholder="0"
                value={monto} 
                onChange={e => setMonto(e.target.value)}
                class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
              />
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Moneda</label>
              <div class="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => setMoneda('ARS')}
                  class={`py-2 rounded-xl font-bold text-xs border transition-all ${
                    moneda === 'ARS' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200'
                  }`}
                >
                  ARS ($)
                </button>
                <button
                  type="button"
                  onClick={() => setMoneda('USD')}
                  class={`py-2 rounded-xl font-bold text-xs border transition-all ${
                    moneda === 'USD' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200'
                  }`}
                >
                  USD
                </button>
              </div>
            </div>

            <button 
              type="submit"
              disabled={isSubmitting}
              class="w-full bg-rose-600 hover:bg-rose-700 active:scale-[0.98] transition-all text-white font-bold py-3.5 rounded-xl shadow-md text-center text-xs tracking-wide mt-2"
            >
              {isSubmitting ? 'GUARDANDO...' : 'REGISTRAR GASTO'}
            </button>
          </form>
        </div>
      );
    }

    function RegistrarView({ onSaved, onCancel }) {
      const [tipo, setTipo] = useState('reparacion');
      const [cliente, setCliente] = useState('');
      const [productoEquipo, setProductoEquipo] = useState('');
      const [trabajo, setTrabajo] = useState('');
      const [costo, setCosto] = useState('');
      const [importe, setImporte] = useState('');
      const [moneda, setMoneda] = useState('ARS');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const ganancia = useMemo(() => {
        const c = parseFloat(costo) || 0;
        const i = parseFloat(importe) || 0;
        return i - c;
      }, [costo, importe]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!productoEquipo || costo === '' || importe === '') return;

        setIsSubmitting(true);

        const payload = {
          tipo,
          cliente: cliente.trim() || null,
          producto_equipo: productoEquipo.trim(),
          trabajo: tipo === 'reparacion' ? trabajo.trim() : null,
          costo: Number(costo),
          importe: Number(importe),
          moneda,
          fecha: new Date().toISOString().split('T')[0]
        };

        try {
          const { error } = await supabaseClient.from('movimientos').insert([payload]);

          setIsSubmitting(false);

          if (!error) {
            onSaved();
          } else {
            alert('Error al guardar: ' + error.message);
          }
        } catch (err) {
          setIsSubmitting(false);
          alert('Error de conexión.');
        }
      };

      return (
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wider">Nuevo Trabajo / Venta</h2>
            <button onClick={onCancel} class="text-xs text-gray-400 font-semibold">Cancelar</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              onClick={() => setTipo('reparacion')}
              class={`py-3 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${
                tipo === 'reparacion' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 border-gray-200'
              }`}
            >
              <span>🔧</span> REPARACIÓN
            </button>
            <button
              type="button"
              onClick={() => setTipo('venta')}
              class={`py-3 px-3 rounded-xl font-bold text-xs flex items-center justify-center gap-2 border transition-all ${
                tipo === 'venta' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 border-gray-200'
              }`}
            >
              <span>📱</span> VENTA
            </button>
          </div>

          <form onSubmit={handleSubmit} class="space-y-3.5">
            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">
                Cliente {tipo === 'venta' && <span class="text-gray-400">(opcional)</span>}
              </label>
              <input 
                type="text" 
                placeholder="Ej: Cliente / Nombre"
                value={cliente} 
                onChange={e => setCliente(e.target.value)}
                class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
              />
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Producto / Equipo</label>
              <input 
                type="text" 
                required
                placeholder="Ej: iPhone XS Max"
                value={productoEquipo} 
                onChange={e => setProductoEquipo(e.target.value)}
                class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
              />
            </div>

            {tipo === 'reparacion' && (
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Trabajo realizado</label>
                <input 
                  type="text" 
                  placeholder="Ej: Cambio de módulo"
                  value={trabajo} 
                  onChange={e => setTrabajo(e.target.value)}
                  class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
                />
              </div>
            )}

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Costo ($)</label>
                <input 
                  type="number" 
                  required
                  step="any"
                  placeholder="0"
                  value={costo} 
                  onChange={e => setCosto(e.target.value)}
                  class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
                />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Cobrado ($)</label>
                <input 
                  type="number" 
                  required
                  step="any"
                  placeholder="0"
                  value={importe} 
                  onChange={e => setImporte(e.target.value)}
                  class="w-full apple-input rounded-xl px-3.5 py-2.5 text-xs font-medium"
                />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Moneda</label>
              <div class="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => setMoneda('ARS')}
                  class={`py-2 rounded-xl font-bold text-xs border transition-all ${
                    moneda === 'ARS' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200'
                  }`}
                >
                  ARS ($)
                </button>
                <button
                  type="button"
                  onClick={() => setMoneda('USD')}
                  class={`py-2 rounded-xl font-bold text-xs border transition-all ${
                    moneda === 'USD' ? 'bg-gray-900 text-white border-gray-900' : 'bg-white text-gray-600 border-gray-200'
                  }`}
                >
                  USD
                </button>
              </div>
            </div>

            <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl flex justify-between items-center">
              <span class="text-xs font-bold text-emerald-800 uppercase tracking-wider">Ganancia estimada</span>
              <span class="text-base font-black text-emerald-600">
                {moneda === 'ARS' ? '$' : 'USD '}{ganancia.toLocaleString('es-AR')}
              </span>
            </div>

            <button 
              type="submit"
              disabled={isSubmitting}
              class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] transition-all text-white font-bold py-3.5 rounded-xl shadow-md text-center text-xs tracking-wide mt-2"
            >
              {isSubmitting ? 'GUARDANDO...' : 'GUARDAR MOVIMIENTO'}
            </button>
          </form>
        </div>
      );
    }

    function HistorialView({ movimientos, gastos }) {
      const [tab, setTab] = useState('gastos');

      return (
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2 bg-gray-200 p-1 rounded-xl">
            <button 
              onClick={() => setTab('gastos')}
              class={`py-2 rounded-lg text-xs font-bold transition-all ${tab === 'gastos' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}
            >
              🛒 Gastos Personales
            </button>
            <button 
              onClick={() => setTab('taller')}
              class={`py-2 rounded-lg text-xs font-bold transition-all ${tab === 'taller' ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500'}`}
            >
              🔧 Trabajos Taller
            </button>
          </div>

          {tab === 'gastos' ? (
            <div class="space-y-2">
              {gastos.length === 0 ? (
                <p class="text-xs text-gray-400 italic py-4 text-center">No hay gastos registrados.</p>
              ) : (
                gastos.map(g => (
                  <div key={g.id} class="apple-card p-3 rounded-xl flex justify-between items-center">
                    <div>
                      <p class="text-xs font-bold text-gray-900">{g.concepto}</p>
                      <p class="text-[10px] text-gray-400 font-semibold">{g.fecha} · {g.categoria}</p>
                    </div>
                    <p class="text-xs font-black text-rose-500">
                      -{g.moneda === 'ARS' ? '$' : 'USD '}{Number(g.monto).toLocaleString('es-AR')}
                    </p>
                  </div>
                ))
              )}
            </div>
          ) : (
            <div class="space-y-2">
              {movimientos.map(m => (
                <div key={m.id} class="apple-card p-3 rounded-xl space-y-1">
                  <div class="flex justify-between items-center text-[10px]">
                    <span class="text-gray-400 font-bold">{m.fecha}</span>
                    <span class="font-bold text-gray-500 uppercase">{m.tipo}</span>
                  </div>
                  <p class="text-xs font-bold text-gray-900">{m.producto_equipo} {m.cliente ? `(${m.cliente})` : ''}</p>
                  <p class="text-xs font-black text-emerald-600 text-right">+{m.moneda === 'ARS' ? '$' : 'USD '}{Number(m.ganancia).toLocaleString('es-AR')}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
